[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-tree"
version = "0.0.6"
description = "Incremental hierarchical clustering tree over content embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
openai = ["openai>=1"]
local = ["sentence-transformers>=2"]
sql = ["sqlalchemy>=2"]

[tool.setuptools]
packages = [
    "embed_tree",
    "embed_tree.cache",
    "embed_tree.embedders",
    "embed_tree.labelers",
    "embed_tree.loaders",
    "embed_tree.persisters",
    "embed_tree.providers",
    "embed_tree.projectors",
    "embed_tree.reconcilers",
    "embed_tree.representation",
    "embed_tree.stores",
]
