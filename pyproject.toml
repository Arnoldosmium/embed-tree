[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-tree"
dynamic = ["version"]
description = "Incremental hierarchical clustering tree over content embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
openai = ["openai>=1"]
local = ["sentence-transformers>=2"]
sql = ["sqlalchemy>=2"]

[tool.setuptools]
packages = [
    "embed_tree",
    "embed_tree.embedders",
    "embed_tree.labelers",
    "embed_tree.loaders",
    "embed_tree.persisters",
    "embed_tree.projectors",
    "embed_tree.reconcilers",
    "embed_tree.representation",
]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
